<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Dungeons & Doodles</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
    <!--    <img src="/assets/img/logo.png" alt="Dungeons & Doodles" id="logo">-->
    <p class="header">Draw something and send it to the main game!</p>
    <div class="brush-controls">
        <button class="tool" id="draw-tool" type="button">
            <img src="/assets/svg/brush.svg" alt="Brush" class="icon">
        </button>
        <button class="tool" id="erase-tool" type="button">
            <img src="/assets/svg/eraser.svg" alt="Eraser" class="icon">
        </button>
        <div>
            <p>Brush Size</p>
            <input id="brush-size" type="range" min="2" max="30" step="1" value="6">
        </div>
        <button class="tool" id="clear" type="button" title="Clear Canvas">
            <img src="/assets/svg/bin.svg" alt="Eraser" class="icon">
        </button>
    </div>
    <div class="canvas-border">
        <canvas id="canvas" width="200" height="200"></canvas>
    </div>
    <div class="buttons">
        <button class="button" id="send" type="button">SEND TO GAME</button>
    </div>
    <p id="status">Connecting…
        <img src="/assets/svg/loading.svg" class="status-icon">
    </p>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/assets/js/drawing.js"></script>
</body>
</html>
